<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo · Entrar</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; line-height: 1.5; color: #1a1a1a; background: #fff; }
    main { padding: 1rem; max-width: 24rem; margin: 0 auto; }
    label { display: block; font-weight: 600; margin-top: 1rem; }
    input { width: 100%; box-sizing: border-box; padding: .5rem; border: 1px solid #555; border-radius: 4px; font: inherit; }
    button { margin-top: 1.25rem; padding: .6rem 1.2rem; background: #003a8c; color: #fff; border: 0; border-radius: 4px; font: inherit; }
    :focus-visible { outline: 3px solid #b35900; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Entrar</h1>
    <!-- Login FICTÍCIO: aceita qualquer usuário/senha não vazios e grava uma "sessão" no localStorage. -->
    <form id="form-login" action="#">
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
  </main>
  <script>
    document.getElementById('form-login').addEventListener('submit', (e) => {
      e.preventDefault();
      const usuario = document.getElementById('usuario').value.trim();
      if (!usuario || !document.getElementById('senha').value) return;
      localStorage.setItem('demo-sessao', usuario);
      location.href = 'area-logada.html';
    });
  </script>
</body>
</html>
